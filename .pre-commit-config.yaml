# Only ~3% of tracked files are first-party. Everything matched below is vendored,
# upstream-owned, or machine-generated, and must not be reformatted by our hooks.
exclude: |
  (?x)^(
    architecture/architecture-portal/|
    planning/_bmad/|
    planning/_bmad-output/|
    archived/|
    .*/\.agents/|
    .*/\.claude/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: check-added-large-files
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        args: [--check]

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        language: node
        additional_dependencies: ['eslint@10']
        entry: eslint
        files: ^prototype/walkthrough-assistant/js/.*\.js$
        pass_filenames: true

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.18.1
    hooks:
      - id: markdownlint-cli2
