name: Continuous Integration

on:
    pull_request:

jobs:
    prettier:
        runs-on: aexp-ubuntu-latest-medium
        steps:
            - uses: actions/checkout@v4
            - uses: amex-eng/setup-node@v4
              with:
                  node-version: '22'

            - run: npm ci
            - run: npm run format:check

    lint:
        runs-on: aexp-ubuntu-latest-medium
        steps:
            - uses: actions/checkout@v4
            - uses: amex-eng/setup-node@v4
              with:
                  node-version: '22'

            - run: npm ci
            - run: npm run lint
